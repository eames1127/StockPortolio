version: 2

# Weekly, grouped PRs keep the noise down for a single maintainer.
# Security fixes are raised straight away regardless of this schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      server-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client-dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
