name: Run Tests

on:
  pull_request:
    branches: [ main ]
  # Also run after merging, so main's own status shows whether it is green.
  push:
    branches: [ main ]

# Tests only need to read the code. Least privilege matters on a public repo.
permissions:
  contents: read

# A new push to a PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          client/package-lock.json

    - name: Install server dependencies
      run: npm ci

    - name: Run server tests
      run: npm test

    - name: Install client dependencies
      run: npm ci
      working-directory: client

    - name: Run client tests
      run: npm test
      working-directory: client

    - name: Build client
      run: npm run build
